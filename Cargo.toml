[package]
name = "compiled-text"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["ed1th"]
categories = ["encoding", "compression", "game-development"]
keywords = ["popcap", "compiled-text", "rijndael", "base64"]
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LambdaEd1th/compiled-text"
description = "Reader and writer for PopCap encrypted Compiled Text files"

[dependencies]
base64 = "0.22"
md-5 = "0.11"
simple-rijndael = "0.3"
smf-container = { git = "https://github.com/LambdaEd1th/smf-container.git", rev = "cc4f3c9cae17780e0c8d746441c8fa949c9d1bb8" }
thiserror = "2"

[package.metadata.docs.rs]
all-features = true
